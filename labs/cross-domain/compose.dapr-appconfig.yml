# Compose OVERRIDE layered by lab.sh on top of the vnext-runtime template's docker-compose.yml:
#   docker compose -f docker-compose.yml -f <this file> ...
# It gives every sidecar an explicit Dapr Configuration (`appconfig`: nameResolution mdns + tracing) and
# a fixed, deterministic internal gRPC port. `command` replaces the template's list
# (so the port flags are restated with the template's env-var defaults); `volumes` is appended.
# LAB_DAPR_CONFIG is exported by lab.sh (absolute path to dapr/appconfig.yaml).
services:
  vnext-db-migrator-dapr:
    command: [
      "./daprd",
      "--app-id", "vnext-db-migrator-${DOMAIN_NAME:-core}",
      "--resources-path", "./components",
      "--config", "/dapr/appconfig.yaml",
      "--dapr-internal-grpc-port", "50002",
      "--dapr-grpc-port", "${DAPR_DBMIGRATOR_GRPC_PORT:-46111}",
      "--dapr-http-port", "${DAPR_DBMIGRATOR_HTTP_PORT:-46110}",
      "--scheduler-host-address", "dapr-scheduler:50007",
      "--placement-host-address", "dapr-placement:50005"
    ]
    volumes:
      - "${LAB_DAPR_CONFIG}:/dapr/appconfig.yaml:ro"
  vnext-orchestration-dapr:
    command: [
      "./daprd",
      "--app-id", "vnext-app-${DOMAIN_NAME:-core}",
      "--app-port", "5000",
      "--resources-path", "./components",
      "--config", "/dapr/appconfig.yaml",
      "--dapr-internal-grpc-port", "50002",
      "--dapr-grpc-port", "${DAPR_ORCHESTRATION_GRPC_PORT:-42111}",
      "--dapr-http-port", "${DAPR_ORCHESTRATION_HTTP_PORT:-42110}",
      "--scheduler-host-address", "dapr-scheduler:50007",
      "--placement-host-address", "dapr-placement:50005"
    ]
    volumes:
      - "${LAB_DAPR_CONFIG}:/dapr/appconfig.yaml:ro"
  vnext-execution-dapr:
    command: [
      "./daprd",
      "--app-id", "vnext-execution-app-${DOMAIN_NAME:-core}",
      "--app-port", "5000",
      "--resources-path", "./components",
      "--config", "/dapr/appconfig.yaml",
      "--dapr-internal-grpc-port", "50002",
      "--dapr-grpc-port", "${DAPR_EXECUTION_GRPC_PORT:-43111}",
      "--dapr-http-port", "${DAPR_EXECUTION_HTTP_PORT:-43110}",
      "--scheduler-host-address", "dapr-scheduler:50007",
      "--placement-host-address", "dapr-placement:50005"
    ]
    volumes:
      - "${LAB_DAPR_CONFIG}:/dapr/appconfig.yaml:ro"
  vnext-worker-inbox-dapr:
    command: [
      "./daprd",
      "--app-id", "vnext-worker-inbox-${DOMAIN_NAME:-core}",
      "--app-port", "5000",
      "--resources-path", "./components",
      "--config", "/dapr/appconfig.yaml",
      "--dapr-internal-grpc-port", "50002",
      "--dapr-grpc-port", "${DAPR_INBOX_GRPC_PORT:-44111}",
      "--dapr-http-port", "${DAPR_INBOX_HTTP_PORT:-44110}",
      "--scheduler-host-address", "dapr-scheduler:50007",
      "--placement-host-address", "dapr-placement:50005"
    ]
    volumes:
      - "${LAB_DAPR_CONFIG}:/dapr/appconfig.yaml:ro"
  vnext-worker-outbox-dapr:
    command: [
      "./daprd",
      "--app-id", "vnext-worker-outbox-${DOMAIN_NAME:-core}",
      "--app-port", "5000",
      "--resources-path", "./components",
      "--config", "/dapr/appconfig.yaml",
      "--dapr-internal-grpc-port", "50002",
      "--dapr-grpc-port", "${DAPR_OUTBOX_GRPC_PORT:-45111}",
      "--dapr-http-port", "${DAPR_OUTBOX_HTTP_PORT:-45110}",
      "--scheduler-host-address", "dapr-scheduler:50007",
      "--placement-host-address", "dapr-placement:50005"
    ]
    volumes:
      - "${LAB_DAPR_CONFIG}:/dapr/appconfig.yaml:ro"
