# x-storage through the Dapr S3 binding to the DUMB store behind TLS: what the bank runs (#145).
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: fsl-stub-dapr
spec:
  type: bindings.aws.s3
  version: v1
  metadata:
    - { name: bucket, value: fsl-stub-dapr }
    - { name: region, value: us-east-1 }
    - { name: endpoint, value: "https://fsl-stub-tls:9443" }
    - { name: accessKey, value: lab }
    - { name: secretKey, value: lab-secret }
    - { name: forcePathStyle, value: "true" }
    - { name: insecureSSL, value: "true" }
